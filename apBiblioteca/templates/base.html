{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'apBiblioteca/estilos.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Ejemplo Layout HTML5</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #92A8D1;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            background-color: #4C528C;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        /* =========================
           NAV
        ========================== */

        .barrasuperior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #242742;
        }

        .barrasuperior .busqueda {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
        }

        .busqueda input {
            width: 200px;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav li {
            padding: 15px 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* =========================
           CONTENIDO PRINCIPAL
        ========================== */

        main {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        /* =========================
           ASIDE
        ========================== */

        aside {
            width: 250px;
            background-color: #dddddd;
            padding: 20px;
            border-radius: 10px;
        }

        aside h2 {
            margin-bottom: 10px;
        }

        aside .busqueda {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        aside .busqueda input {
            flex: 1;
            min-width: 0;
        }

        aside .busqueda button {
            flex-shrink: 0;
        }

        aside ul {
            list-style-type: none;
        }

        /* =========================
           CONTENIDO CENTRAL
        ========================== */

        .contenido {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        section {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        article {
            margin-top: 15px;
            padding: 15px;
            background-color: #f0f0f0;
            border-left: 5px solid #DD5293;
            flex: 1;
        }

        article .encabezado {
            display: flex;
        }

        article h3 {
            display: flex;
            flex: 1;
        }

        .boton {
            display: inline-block;
            padding: 8px 12px;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-left: 5px;
        }

        .boton:hover {
            background-color: #0b5ed7;
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            background-color: #242742;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
    <!-- CABECERA -->
    <header>
        <h1>Biblioteca Carena</h1>
        <p>Ejemplo de estructura semántica HTML5</p>
    </header>

    <!-- MENÚ -->
    <div class="barrasuperior">
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Noticias</a></li>
                <li><a href="#">Cursos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>

<!--        <div class="row">-->
<!--            <form class="busqueda">-->
<!--                <input type="text"-->
<!--                       class="form-control"-->
<!--                       name="q"-->
<!--                       placeholder="Buscar autor..."-->
<!--                       value="{{ request.GET.q }}"-->
<!--                >-->
<!--                <button type="submit" class="btn btn-primary">Buscar</button>-->
<!--            </form>-->
<!--        </div>-->
    </div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- PIE -->
    <footer>
        <p>
            © 2026 - UPC HTML5 + CSS
        </p>
    </footer>

</body>

</html>
