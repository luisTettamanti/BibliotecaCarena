{% extends "base.html" %}
{% load static %}
{% block content %}
    <div id="contenido" class="container">
        <div id="titulo" class="row pb-3 mt-5">
            <h2 class="titulo col-4 col-lg-6">Libros</h2>
            <form method="GET" class="col-5 col-lg-4">
                <div class="input-group">
                    <input type="text" class="form-control" name="q" value="{{ query }}" \
                        placeholder="Buscar...">
                    <button class="btn btn-primary text-light" type="submit">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-search" viewBox="0 0 16 16">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                        </svg>
                    </button>
                </div>
            </form>

            <div class="col-3 col-lg-2 text-end">
                <a class="btn btn-primary w-100" href="{% url 'libroagregar' %}">Nuevo...</a>
            </div>

        </div>

        <table class="table table-striped table-hover">
            <thead class="table table-dark">
                <tr>
                    <th class="align-middle d-none d-lg-table-cell">Id</th>
                    <th class="align-middle">Título</th>
                    <th class="align-middle d-none d-md-table-cell">Autor</th>
                    <th class="align-middle d-none d-lg-table-cell">Editorial</th>
                    <th class="align-middle d-none d-lg-table-cell">Año</th>
                    <th class="align-middle"></th>
                </tr>
            </thead>
            <tbody>
                {% for l in libros %}
                <tr style="cursor:pointer;" onclick="window.location.href='{% url 'librodetalle' l.id %}'">
                    <td class="align-middle d-none d-lg-table-cell">{{ l.id }}</td>
                    <td class="align-middle">{{ l.titulo }}</td>
                    <td class="align-middle d-none d-md-table-cell">{{ l.autor }}</td>
                    <td class="align-middle d-none d-lg-table-cell">{{ l.editorial }}</td>
                    <td class="align-middle d-none d-lg-table-cell">{{ l.anioPub }}</td>
                    <td class="align-middle">
                        <div class="d-flex justify-content-end align-items-end">

                                <a class="btn btn-primary" href="{% url 'libromodificar' l.id %}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-pencil" viewBox="0 0 16 16">
                                    <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"/>
                                </svg>
                                </a>

                                <a class="btn btn-danger ms-1" href="{% url 'libroborrar' l.id %}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-eraser" viewBox="0 0 16 16">
                                        <path d="M8.086 2.207a2 2 0 0 1 2.828 0l3.879 3.879a2 2 0 0 1 0 2.828l-5.5 5.5A2 2 0 0 1 7.879 15H5.12a2 2 0 0 1-1.414-.586l-2.5-2.5a2 2 0 0 1 0-2.828zm2.121.707a1 1 0 0 0-1.414 0L4.16 7.547l5.293 5.293 4.633-4.633a1 1 0 0 0 0-1.414zM8.746 13.547 3.453 8.254 1.914 9.793a1 1 0 0 0 0 1.414l2.5 2.5a1 1 0 0 0 .707.293H7.88a1 1 0 0 0 .707-.293z"/>
                                    </svg>
                                </a>

                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
