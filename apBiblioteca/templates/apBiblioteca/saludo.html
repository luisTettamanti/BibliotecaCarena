<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Formulario GET</h1>
    <form method="GET">

        <label>Nombre:</label>
        <input type="text" name="nombre">
        <button type="submit">Enviar</button>

    </form>

    {% if nombre %}
        <h2>Hola {{ nombre }}</h2>
    {% endif %}

</body>
</html>
