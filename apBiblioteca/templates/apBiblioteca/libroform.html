{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row py-3">
        <div class="col-12 col-lg-6 mx-auto">
        <h1>Nuevo Libro</h1>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Guardar
            </button>
            <a class="btn btn-primary" href="{% url "libroslista" %}">Cancelar</a>
        </form>

        </div>
    </div>
</div>
{% endblock %}
